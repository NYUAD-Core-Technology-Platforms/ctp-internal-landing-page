# Apache (httpd) config for the CTP internal landing page.
#
# You only need this file if WEB_ROOT in /etc/ctp-landing.conf is NOT
# /var/www/html (for example because this server already hosts another site).
#
#   sudo cp deploy/apache-ctp-landing.conf /etc/httpd/conf.d/ctp-landing.conf
#   sudo nano /etc/httpd/conf.d/ctp-landing.conf      # set ServerName and paths
#   sudo apachectl configtest && sudo systemctl reload httpd
#
# If the server already has HTTPS set up (mod_ssl, /etc/httpd/conf.d/ssl.conf),
# put the DocumentRoot/Directory lines inside that <VirtualHost *:443> instead,
# or copy this block to a second <VirtualHost *:443> with your SSL lines.

<VirtualHost *:80>
    ServerName ctp.example.nyu.edu
    DocumentRoot "/var/www/ctp-landing"

    <Directory "/var/www/ctp-landing">
        Options -Indexes
        AllowOverride None
        Require all granted
        # Internal page: to restrict to campus/VPN addresses, replace the line
        # above with e.g.   Require ip 10.0.0.0/8
    </Directory>

    # Content files must never be cached stale; assets can be cached briefly.
    <FilesMatch "\.(yaml|json|html)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    AddType text/yaml .yaml

    # Never serve the deploy marker.
    <Files ".ctp-landing">
        Require all denied
    </Files>
</VirtualHost>
