name: Check links.yaml

# Catches a broken site/links.yaml on GitHub before the server deploys it.
# (The server runs the same check and refuses to publish on failure.)
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NYUAD-Core-Technology-Platforms/ctp-common
          path: .ctp-common
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/check.py --common-dir .ctp-common/data
